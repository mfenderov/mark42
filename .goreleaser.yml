version: 2

before:
  hooks:
    - sh -c 'jq --arg v "{{ .Version }}" ".version = \$v" npm/package.json > npm/package.json.tmp && mv npm/package.json.tmp npm/package.json'

builds:
  - id: cli
    main: ./cmd/memory
    binary: mark42
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/mfenderov/mark42/internal/cli.Version={{.Version}}

  - id: server
    main: ./cmd/server
    binary: mark42-server
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # Plugin manifest
      - src: .claude-plugin/plugin.json
        dst: .claude-plugin/plugin.json
      # Agents (flat directory with .md files)
      - src: agents/*.md
        dst: agents/
      # Skills (nested structure)
      - src: skills/**/SKILL.md
      # Commands (flat directory with .md files)
      - src: commands/*.md
        dst: commands/
      # Hooks config (Go hooks are compiled into mark42 binary)
      - src: hooks/hooks.json
        dst: hooks/hooks.json
      # NOTE: .mcp.json excluded - ${CLAUDE_PLUGIN_ROOT} variable not resolved by Claude Code
      # Users must run: claude mcp add mark42 --scope user --transport stdio -- ~/.claude/plugins/local/mark42/bin/mark42-server
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
