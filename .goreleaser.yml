version: 2

before:
  hooks:
    - sh -c 'jq --arg v "{{ .Version }}" ".version = \$v" npm/package.json > npm/package.json.tmp && mv npm/package.json.tmp npm/package.json'

builds:
  - id: cli
    main: ./cmd/memory
    binary: mark42
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/mfenderov/mark42/internal/cli.Version={{.Version}}

  - id: server
    main: ./cmd/server
    binary: mark42-server
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: mark42
    repository:
      owner: mfenderov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/mfenderov/mark42"
    description: "Local, privacy-first RAG memory system for Claude Code"
    binaries:
      - mark42
      - mark42-server
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mark42"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mark42-server"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
