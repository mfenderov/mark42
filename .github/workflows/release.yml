name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.3.0). If omitted, uses the ref that triggered the workflow.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release tag
        run: |
          EXACT_TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [ -z "$EXACT_TAG" ]; then
            echo "Error: HEAD ($(git rev-parse --short HEAD)) does not point to an exact git tag."
            echo "Provide a valid tag input (e.g. -f tag=v3.3.0) or trigger on a git tag ref."
            exit 1
          fi
          echo "Releasing verified tag: $EXACT_TAG"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: npm
