name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go tool golangci-lint run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test -v -race ./...

      - name: CRAP gate
        run: make crap

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build -o mark42 ./cmd/memory

      - run: go build -o mark42-server ./cmd/server

  release:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (provenance)
    concurrency:
      group: release
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Auto bump version and tag
        uses: cocogitto/cocogitto-action@v3
        with:
          release: true
          # No `check`: cog check rejects the repo's historical dependabot
          # merge commits. `bump --auto` itself skips non-conventional
          # commits safely (verified), so linting would only add red noise.
          check: false
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      # NOTE: pushes made with GITHUB_TOKEN do not trigger new workflow
      # runs, so the tag-triggered release.yml never fires for bot pushes.
      # GoReleaser + npm therefore run inline here; release.yml remains
      # as the manual-tag path (disjoint: manual tags skip this job).
      - name: Push version commit and tag
        id: push
        run: |
          BEFORE="${{ steps.before.outputs.tag }}"
          AFTER="$(git describe --tags --abbrev=0)"
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new version — nothing to release."
          else
            git push origin main
            git push origin "$AFTER"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.push.outputs.released == 'true'
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        if: steps.push.outputs.released == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        if: steps.push.outputs.released == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        if: steps.push.outputs.released == 'true'
        run: npm publish --access public --provenance
        working-directory: npm
