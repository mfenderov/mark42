name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go tool golangci-lint run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test -v -race ./...

      - name: CRAP gate
        run: make crap

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build -o mark42 ./cmd/memory

      - run: go build -o mark42-server ./cmd/server

  release:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Auto bump version and tag
        uses: cocogitto/cocogitto-action@v3
        with:
          release: true
          # No `check`: cog check rejects the repo's historical dependabot
          # merge commits. `bump --auto` itself skips non-conventional
          # commits safely (verified), so linting would only add red noise.
          check: false
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      # Bot pushes made with GITHUB_TOKEN do not trigger push-event workflows,
      # but GITHUB_TOKEN with actions:write CAN trigger workflow_dispatch events.
      # We dispatch release.yml so npm Trusted Publishing (which is configured
      # on npmjs.com specifically for release.yml) authenticates successfully via OIDC.
      - name: Push version commit and tag, then trigger release
        run: |
          BEFORE="${{ steps.before.outputs.tag }}"
          AFTER="$(git describe --tags --abbrev=0)"
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "No new version — nothing to release."
          else
            git push origin main
            git push origin "$AFTER"
            echo "Triggering release workflow for $AFTER..."
            gh workflow run release.yml --ref main -f tag="$AFTER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
